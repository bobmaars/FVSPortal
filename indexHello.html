<!-- indexHello.html -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Welcome to BobMaars.github.io</title>
  <style>
    body { font-family: sans-serif; background: #f9f9f9; padding: 2em; }
    h1 { color: #333; }
    .emoji-divider { font-size: 2em; text-align: center; margin: 1em 0; }
    .theme-toggle { margin-top: 2em; }
    .dark-mode { background: #222; color: #eee; }
  </style>
</head>
<body>
  <h1>🎶 Welcome to Bob's Modular Portal and Hello from GitHub Pages!</h1>
  <div class="emoji-divider">🎵🎨🛠️</div>
  <p>This site will host my ensemble music tools, scripting dashboards, and joyful automation routines.</p>
  <button onclick="toggleTheme()">🌓 Toggle Theme</button>

  <script>
    function toggleTheme() {
      document.body.classList.toggle('dark-mode');
    }
  </script>
</body>
</html>
